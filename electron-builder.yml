appId: com.shiyi.jizhang
productName: 十一记账
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{build,release}'
asarUnpack:
  - node_modules/sql.js/**
win:
  target:
    - nsis
  artifactName: ShiyiJiZhang-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 十一记账
mac:
  target:
    - dmg
  category: public.app-category.finance
  artifactName: ShiyiJiZhang-${version}.${ext}
